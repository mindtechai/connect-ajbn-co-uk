name: iOS Build 8 - AJBN Connect (No Mac Needed)

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Xcode project for uk.co.ajbn.connect Build 8
        run: |
          set -e
          rm -rf AJBNConnect build
          mkdir -p AJBNConnect/AJBNConnect/Assets.xcassets/AppIcon.appiconset
          
          cat > AJBNConnect/AJBNConnect/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              },
              {
                "idiom" : "iphone",
                "scale" : "2x",
                "size" : "20x20"
              },
              {
                "idiom" : "iphone",
                "scale" : "3x",
                "size" : "20x20"
              },
              {
                "idiom" : "iphone",
                "scale" : "2x",
                "size" : "29x29"
              },
              {
                "idiom" : "iphone",
                "scale" : "3x",
                "size" : "29x29"
              },
              {
                "idiom" : "iphone",
                "scale" : "2x",
                "size" : "40x40"
              },
              {
                "idiom" : "iphone",
                "scale" : "3x",
                "size" : "40x40"
              },
              {
                "idiom" : "iphone",
                "scale" : "2x",
                "size" : "60x60"
              },
              {
                "idiom" : "iphone",
                "scale" : "3x",
                "size" : "60x60"
              },
              {
                "idiom" : "ios-marketing",
                "scale" : "1x",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          cat > AJBNConnect/AJBNConnect/Assets.xcassets/Contents.json << 'JSON'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          # Use Android icon if present in repo, otherwise generate AJBN CONNECT matching Android
          echo "Looking for Android icon in repo..."
          ls -la
          FOUND_ICON=""
          if [ -f "AppIcon-1024.png" ]; then FOUND_ICON="AppIcon-1024.png"; fi
          if [ -f "icon-512-maskable.png" ]; then FOUND_ICON="icon-512-maskable.png"; fi
          if [ -f "ios-ajbn/AppIcon-1024.png" ]; then FOUND_ICON="ios-ajbn/AppIcon-1024.png"; fi
          if [ -f "ios/AppIcon-1024.png" ]; then FOUND_ICON="ios/AppIcon-1024.png"; fi
          
          if [ -n "$FOUND_ICON" ]; then
            echo "Found icon: $FOUND_ICON - converting to 1024"
            python3 - << PY
          from PIL import Image
          import os
          src = os.environ.get('FOUND_ICON','')
          # We need to get FOUND_ICON from shell - use env var
          PY
            # Use python with the found file
            python3 << PY
          from PIL import Image
          import pathlib, os
          # Find the icon file
          candidates = ["AppIcon-1024.png", "icon-512-maskable.png", "ios-ajbn/AppIcon-1024.png", "ios/AppIcon-1024.png"]
          src=None
          for c in candidates:
              if pathlib.Path(c).exists():
                  src=pathlib.Path(c)
                  break
          print(f"Using src {src}")
          if src:
              im=Image.open(src)
              # Convert to 1024x1024 RGB
              im=im.convert('RGB')
              im1024=im.resize((1024,1024), Image.LANCZOS)
              im1024.save("AJBNConnect/AJBNConnect/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")
              print("Converted Android icon to iOS 1024")
          PY
          else
            echo "No Android icon file found in repo - generating AJBN CONNECT matching Android"
            python3 - << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os, glob
          size=1024
          bg=(22, 65, 100)  # Android dark blue from icon-512-maskable.png
          fg=(255,255,255)
          img=Image.new('RGB',(size,size), bg)
          draw=ImageDraw.Draw(img)
          # Try to find bold font
          font_ajbn=None
          font_connect=None
          candidates = [
              "/System/Library/Fonts/Helvetica.ttc",
              "/System/Library/Fonts/Supplemental/Arial Bold.ttf",
              "/System/Library/Fonts/Supplemental/Helvetica Bold.ttf",
              "/System/Library/Fonts/HelveticaNeue.ttc",
          ] + glob.glob("/System/Library/Fonts/*.ttf") + glob.glob("/System/Library/Fonts/Supplemental/*.ttf")
          for fp in candidates:
              try:
                  if not os.path.exists(fp):
                      continue
                  font_ajbn = ImageFont.truetype(fp, 300)
                  font_connect = ImageFont.truetype(fp, 72)
                  print(f"Using font {fp}")
                  break
              except:
                  continue
          if font_ajbn is None:
              font_ajbn = ImageFont.load_default()
              font_connect = ImageFont.load_default()
          try:
              draw.text((size//2, size//2 - 30), "AJBN", fill=fg, font=font_ajbn, anchor="mm")
              draw.text((size//2 + 90, size//2 + 130), "CONNECT", fill=fg, font=font_connect, anchor="mm")
          except:
              # fallback positioning
              bbox = draw.textbbox((0,0), "AJBN", font=font_ajbn)
              w=bbox[2]-bbox[0]
              draw.text(((size-w)//2, size//2 - 50), "AJBN", fill=fg, font=font_ajbn)
              draw.text((size//2 + 50, size//2 + 100), "CONNECT", fill=fg, font=font_connect)
          img.save("AJBNConnect/AJBNConnect/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")
          print("Generated AJBN CONNECT icon matching Android")
          PY
          fi

          cat > AJBNConnect/AJBNConnect/AJBNConnectApp.swift << 'SWIFT'
          import SwiftUI
          @main
          struct AJBNConnectApp: App {
              var body: some Scene { WindowGroup { ContentView() } }
          }
          SWIFT

          cat > AJBNConnect/AJBNConnect/ContentView.swift << 'SWIFT'
          import SwiftUI
          struct ContentView: View {
              private let siteURL = URL(string: "https://connect.ajbn.co.uk")!
              var body: some View {
                  ZStack {
                      Color(red: 0.08, green: 0.18, blue: 0.30).ignoresSafeArea()
                      WebView(url: siteURL).ignoresSafeArea(.all, edges: .bottom)
                  }.preferredColorScheme(.light)
              }
          }
          SWIFT

          cat > AJBNConnect/AJBNConnect/WebView.swift << 'SWIFT'
          import SwiftUI
          import WebKit
          struct WebView: UIViewRepresentable {
              let url: URL
              func makeUIView(context: Context) -> WKWebView {
                  let wv = WKWebView()
                  wv.navigationDelegate = context.coordinator
                  wv.allowsBackForwardNavigationGestures = true
                  return wv
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {
                  if uiView.url == nil { uiView.load(URLRequest(url: url)) }
              }
              func makeCoordinator() -> Coordinator { Coordinator() }
              class Coordinator: NSObject, WKNavigationDelegate {
                  func webView(_ webView: WKWebView, decidePolicyFor action: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                      if let url = action.request.url {
                          if url.scheme == "mailto" || url.scheme == "tel" { UIApplication.shared.open(url); decisionHandler(.cancel); return }
                          if url.host != "connect.ajbn.co.uk" && (url.scheme == "http" || url.scheme == "https") { UIApplication.shared.open(url); decisionHandler(.cancel); return }
                      }
                      decisionHandler(.allow)
                  }
              }
          }
          SWIFT

          cat > AJBNConnect/AJBNConnect/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTD/PLIST/1.0.dtd">
          <plist version="1.0">
          <dict>
                  <key>CFBundleName</key><string>AJBNConnect</string>
                  <key>CFBundleDisplayName</key><string>AJBN Connect</string>
                  <key>CFBundleExecutable</key><string>AJBNConnect</string>
                  <key>CFBundleIdentifier</key><string>uk.co.ajbn.connect</string>
                  <key>CFBundleVersion</key><string>8</string>
                  <key>CFBundleShortVersionString</key><string>1.0.3</string>
                  <key>CFBundlePackageType</key><string>APPL</string>
                  <key>CFBundleIcons</key><dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconName</key><string>AppIcon</string><key>CFBundleIconFiles</key><array><string>AppIcon</string></array></dict></dict>
                  <key>CFBundleIconName</key><string>AppIcon</string>
                  <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
                  <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
                  <key>UISupportedInterfaceOrientations~ipad</key><array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
                  <key>UIRequiresFullScreen</key><true/>
                  <key>ITSAppUsesNonExemptEncryption</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cat > project.yml << 'EOF'
          name: AJBNConnect
          options:
            bundleIdPrefix: uk.co.ajbn
            xcodeVersion: "15.0"
          targets:
            AJBNConnect:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources: [AJBNConnect]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: uk.co.ajbn.connect
                  PRODUCT_NAME: AJBNConnect
                  DEVELOPMENT_TEAM: WR8R9QALMK
                  CODE_SIGN_STYLE: Automatic
                  MARKETING_VERSION: 1.0.3
                  CURRENT_PROJECT_VERSION: 8
                  INFOPLIST_FILE: AJBNConnect/AJBNConnect/Info.plist
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          EOF
          xcodegen generate
          ls -la AJBNConnect.xcodeproj
          ls -lh AJBNConnect/AJBNConnect/Assets.xcassets/AppIcon.appiconset/

      - name: Setup App Store Connect API Key
        env:
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Build Archive WITH signing
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -e
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          xcodebuild -project AJBNConnect.xcodeproj -scheme AJBNConnect -configuration Release -destination 'generic/platform=iOS' -archivePath $PWD/build/AJBNConnect.xcarchive archive -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Export IPA with App Store signing
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -e
          if [ -f "ios/exportOptions.plist" ]; then cp ios/exportOptions.plist ./exportOptions.plist; fi
          if [ ! -f "exportOptions.plist" ]; then
            cat > exportOptions.plist << 'EOP'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTD/PLIST/1.0.dtd">
          <plist version="1.0">
          <dict>
                  <key>method</key><string>app-store</string>
                  <key>teamID</key><string>WR8R9QALMK</string>
                  <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOP
          fi
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          xcodebuild -exportArchive -archivePath $PWD/build/AJBNConnect.xcarchive -exportPath $PWD/build -exportOptionsPlist exportOptions.plist -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID"
          find $PWD/build -name "*.ipa" -exec ls -lh {} \;

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -e
          IPA_PATH=$(find $PWD/build -name "*.ipa" -type f | head -n 1)
          echo "Uploading $IPA_PATH"
          xcrun altool --upload-app -f "$IPA_PATH" --apiKey $API_KEY_ID --apiIssuer $API_ISSUER_ID --verbose
