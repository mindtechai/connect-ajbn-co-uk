name: iOS Build 5 - AJBN Connect (No Mac Needed)

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo structure
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== ios folder (your repo) ==="
          ls -la ios/ || echo "no ios folder"
          echo "=== .github/workflows ==="
          ls -la .github/workflows/

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Xcode project structure for uk.co.ajbn.connect Build 5
        run: |
          set -e
          echo "Creating AJBNConnect project structure..."
          rm -rf AJBNConnect
          mkdir -p AJBNConnect/AJBNConnect
          
          # Create Swift files directly (guaranteed correct for Build 5)
          cat > AJBNConnect/AJBNConnect/AJBNConnectApp.swift << 'SWIFT'
          import SwiftUI
          @main
          struct AJBNConnectApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          SWIFT

          cat > AJBNConnect/AJBNConnect/ContentView.swift << 'SWIFT'
          import SwiftUI
          struct ContentView: View {
              private let siteURL = URL(string: "https://connect.ajbn.co.uk")!
              var body: some View {
                  ZStack {
                      Color(red: 0.08, green: 0.18, blue: 0.30).ignoresSafeArea()
                      WebView(url: siteURL)
                          .ignoresSafeArea(.all, edges: .bottom)
                  }
                  .preferredColorScheme(.light)
              }
          }
          SWIFT

          cat > AJBNConnect/AJBNConnect/WebView.swift << 'SWIFT'
          import SwiftUI
          import WebKit
          struct WebView: UIViewRepresentable {
              let url: URL
              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  let wv = WKWebView(frame: .zero, configuration: config)
                  wv.navigationDelegate = context.coordinator
                  wv.allowsBackForwardNavigationGestures = true
                  return wv
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {
                  if uiView.url == nil {
                      uiView.load(URLRequest(url: url))
                  }
              }
              func makeCoordinator() -> Coordinator { Coordinator() }
              class Coordinator: NSObject, WKNavigationDelegate {
                  func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                      if let url = navigationAction.request.url {
                          if url.scheme == "mailto" || url.scheme == "tel" {
                              UIApplication.shared.open(url)
                              decisionHandler(.cancel)
                              return
                          }
                          if url.host != "connect.ajbn.co.uk" && (url.scheme == "http" || url.scheme == "https") {
                              UIApplication.shared.open(url)
                              decisionHandler(.cancel)
                              return
                          }
                      }
                      decisionHandler(.allow)
                  }
              }
          }
          SWIFT

          # Create Info.plist with correct Bundle ID uk.co.ajbn.connect Build 5
          cat > AJBNConnect/AJBNConnect/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTD/PLIST/1.0.dtd">
          <plist version="1.0">
          <dict>
                  <key>CFBundleName</key>
                  <string>AJBN Connect</string>
                  <key>CFBundleDisplayName</key>
                  <string>AJBN Connect</string>
                  <key>CFBundleIdentifier</key>
                  <string>uk.co.ajbn.connect</string>
                  <key>CFBundleVersion</key>
                  <string>5</string>
                  <key>CFBundleShortVersionString</key>
                  <string>1.0.2</string>
                  <key>NSCameraUsageDescription</key>
                  <string>For profile photos and event networking</string>
                  <key>NSPhotoLibraryUsageDescription</key>
                  <string>For profile photos</string>
                  <key>NSAppTransportSecurity</key>
                  <dict>
                          <key>NSAllowsArbitraryLoads</key>
                          <false/>
                          <key>NSExceptionDomains</key>
                          <dict>
                                  <key>ajbn.co.uk</key>
                                  <dict>
                                          <key>NSIncludesSubdomains</key>
                                          <true/>
                                          <key>NSExceptionAllowsInsecureHTTPLoads</key>
                                          <false/>
                                          <key>NSExceptionRequiresForwardSecrecy</key>
                                          <false/>
                                  </dict>
                          </dict>
                  </dict>
                  <key>UILaunchStoryboardName</key>
                  <string>LaunchScreen</string>
                  <key>UISupportedInterfaceOrientations</key>
                  <array>
                          <string>UIInterfaceOrientationPortrait</string>
                  </array>
          </dict>
          </plist>
          PLIST

          echo "=== Created files ==="
          ls -la AJBNConnect/AJBNConnect/
          cat AJBNConnect/AJBNConnect/Info.plist

      - name: Generate Xcode project (FIXED PATH)
        run: |
          set -e
          brew install xcodegen

          cat > project.yml << 'EOF'
          name: AJBNConnect
          options:
            bundleIdPrefix: uk.co.ajbn
            xcodeVersion: "15.0"
          targets:
            AJBNConnect:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources:
                - AJBNConnect
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: uk.co.ajbn.connect
                  DEVELOPMENT_TEAM: WR8R9QALMK
                  CODE_SIGN_STYLE: Automatic
                  MARKETING_VERSION: 1.0.2
                  CURRENT_PROJECT_VERSION: 5
                  INFOPLIST_FILE: AJBNConnect/AJBNConnect/Info.plist
                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "14.0"
          EOF

          echo "=== project.yml ==="
          cat project.yml

          # Generate project AT ROOT - no --project flag
          xcodegen generate

          echo "=== After xcodegen ==="
          ls -la
          echo "=== Checking for xcodeproj ==="
          ls -la *.xcodeproj 2>&1 || echo "No xcodeproj at root"
          ls -la AJBNConnect/*.xcodeproj 2>&1 || echo "No xcodeproj in AJBNConnect folder"
          
          # If generated in subfolder, move it to root for next step
          if [ -d "AJBNConnect/AJBNConnect.xcodeproj" ]; then
            echo "Found project in AJBNConnect/AJBNConnect.xcodeproj - moving to root"
            mv AJBNConnect/AJBNConnect.xcodeproj ./AJBNConnect.xcodeproj
          fi
          if [ -d "AJBNConnect.xcodeproj" ]; then
            echo "SUCCESS: AJBNConnect.xcodeproj exists at root"
            ls -la AJBNConnect.xcodeproj/
          else
            echo "ERROR: xcodeproj not found!"
            find . -name "*.xcodeproj" -type d
            exit 1
          fi

      - name: Setup App Store Connect API Key
        env:
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          ls -la ~/.appstoreconnect/private_keys/
          echo "API Key ASTZTUJTA6 installed"

      - name: Build Archive (FIXED - with API Key Auth)
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -e
          echo "Building with uk.co.ajbn.connect Build 5..."
          echo "Key ID: $API_KEY_ID"
          echo "Issuer ID: $API_ISSUER_ID"
          # Ensure API key exists at expected path
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "Key path: $KEY_PATH"
          ls -la "$KEY_PATH"
          # Build with API key auth for automatic provisioning
          xcodebuild -project AJBNConnect.xcodeproj -scheme AJBNConnect -configuration Release -destination 'generic/platform=iOS' -archivePath $PWD/build/AJBNConnect.xcarchive archive -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Export IPA (FIXED)
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -e
          if [ -f "ios/exportOptions.plist" ]; then
            cp ios/exportOptions.plist ./exportOptions.plist
            echo "Using ios/exportOptions.plist"
          elif [ -f "ios-ajbn/exportOptions.plist" ]; then
            cp ios-ajbn/exportOptions.plist ./exportOptions.plist
            echo "Using ios-ajbn/exportOptions.plist"
          else
            cat > exportOptions.plist << 'EOP'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTD/PLIST/1.0.dtd">
          <plist version="1.0">
          <dict>
                  <key>method</key>
                  <string>app-store</string>
                  <key>teamID</key>
                  <string>WR8R9QALMK</string>
                  <key>signingStyle</key>
                  <string>automatic</string>
                  <key>stripSwiftSymbols</key>
                  <true/>
                  <key>uploadSymbols</key>
                  <true/>
          </dict>
          </plist>
          EOP
          fi
          cat exportOptions.plist
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          xcodebuild -exportArchive -archivePath $PWD/build/AJBNConnect.xcarchive -exportPath $PWD/build -exportOptionsPlist exportOptions.plist -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID"
          ls -lh build/

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "Uploading Build 5 uk.co.ajbn.connect to TestFlight..."
          echo "Key ID: $API_KEY_ID"
          echo "Issuer ID: $API_ISSUER_ID"
          # Try altool, fallback to notarytool if needed
          xcrun altool --upload-app -f $PWD/build/AJBNConnect.ipa --apiKey $API_KEY_ID --apiIssuer $API_ISSUER_ID --verbose || xcrun altool --upload-app -f $PWD/build/AJBNConnect.ipa --apiKey $API_KEY_ID --apiIssuer $API_ISSUER_ID
          echo "✅ SUCCESS: Build 5 uploaded - check App Store Connect Builds"
