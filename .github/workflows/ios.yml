name: Build iOS IPA uk.co.ajbn.connect
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: bunx @capacitor/cli sync ios
      
      - name: Build unsigned .app
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath $PWD/build/derivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          ls -R build/derivedData/Build/Products/ || true
          
      - name: Make IPA from .app
        run: |
          cd ios/App
          mkdir -p build/ipa
          APP_PATH=$(find build/derivedData -name "App.app" -type d | head -1)
          echo "Found: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r build/ipa/AJBN-Connect-unsigned.ipa Payload
          ls -lh build/ipa/
          
      - uses: actions/upload-artifact@v5
        with:
          name: AJBN-iOS-build
          path: ios/App/build/ipa/
          if-no-files-found: error
