name: Build iOS IPA uk.co.ajbn.connect
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Setup CocoaPods
        run: |
          cd ios/App
          pod install
      - name: Build IPA unsigned
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AJBN-iOS-build
          path: ios/App/build/
