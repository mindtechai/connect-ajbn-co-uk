name: Build iOS IPA uk.co.ajbn.connect
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: bunx @capacitor/cli add ios || true
      - run: bunx @capacitor/cli sync ios

      - name: Find Xcode workspace
        run: |
          find ios -name "*.xcworkspace" -o -name "*.xcodeproj"
          ls -la ios/App/ || true
          ls -la ios/ || true

      - name: Build Archive unsigned
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -1)
          PROJECT=$(find ios -name "*.xcodeproj" | head -1)
          echo "Workspace: $WORKSPACE"
          echo "Project: $PROJECT"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/ios/App/build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          else
            xcodebuild -project "$PROJECT" -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/ios/App/build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          fi
          ls -lh ios/App/build/

      - name: Make IPA for Windows
        run: |
          APP_PATH=$(find ios/App/build/App.xcarchive -name "App.app" -type d | head -1)
          echo "Found App: $APP_PATH"
          mkdir -p ios/App/build/ipa/Payload
          cp -r "$APP_PATH" ios/App/build/ipa/Payload/
          cd ios/App/build/ipa
          zip -r AJBN-Connect-unsigned.ipa Payload
          ls -lh

      - uses: actions/upload-artifact@v5
        with:
          name: AJBN-iOS-build
          path: |
            ios/App/build/App.xcarchive
            ios/App/build/ipa/
          if-no-files-found: error
