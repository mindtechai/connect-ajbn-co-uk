name: Build Android AAB uk.co.ajbn.connect
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bun run build

      - name: Ensure web assets exist
        run: |
          echo "Checking build output..."
          ls -la
          # Create dist from whatever build produced
          if [ ! -d "dist" ]; then
            if [ -d "build" ]; then cp -r build dist; 
            elif [ -d "out" ]; then cp -r out dist;
            else mkdir -p dist; fi
          fi
          # Fallback page if dist is still empty - opens live site
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=https://connect.ajbn.co.uk"></head><body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh">Opening AJBN Connect...</body></html>' > dist/index.html
          fi
          mkdir -p android/app/src/main/assets
          if [ ! -d "android" ]; then npx @capacitor/cli add android; fi
          ls -lh dist/

      - run: npx @capacitor/cli sync android

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secrets"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/keystore.properties
          elif [ -f android/app/upload-keystore.jks ] && [ -f android/keystore.properties ]; then
            echo "Using keystore committed in the repository"
          else
            echo "::warning::No signing keystore available - the bundle will be UNSIGNED"
          fi

      - name: Build release bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: List outputs
        run: ls -lh android/app/build/outputs/bundle/release/

      - uses: actions/upload-artifact@v5
        with:
          name: AJBN-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
