
name: Build Android AAB uk.co.ajbn.connect
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - run: bun install
      - run: bun run build

      - name: Find TanStack build and prepare dist
        run: |
          echo "=== .output ==="; ls -lh .output/ 2>&1 | head -50
          echo "=== .output/public ==="; ls -lh .output/public/ 2>&1 | head -50
          echo "=== dist ==="; ls -lh dist/ 2>&1 | head -20

          mkdir -p dist
          
          # TanStack Start outputs to .output/public - copy it
          if [ -f ".output/public/index.html" ]; then
            echo "Copying .output/public -> dist"
            cp -r .output/public/* dist/
          elif [ -f "dist/index.html" ]; then
            echo "dist already exists"
          else
            echo "Creating placeholder dist for wrapper mode"
            echo '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style></head><body>Loading AJBN Connect...</body></html>' > dist/index.html
          fi
          
          ls -lh dist/ | head -20
          cat dist/index.html | head -20

      - run: |
          if [ ! -d "android" ]; then npx @capacitor/cli add android; fi
          npx @capacitor/cli copy android
          npx @capacitor/cli sync android

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            { echo "storeFile=upload-keystore.jks"; echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"; echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"; echo "keyPassword=$ANDROID_KEY_PASSWORD"; } > android/keystore.properties
          fi

      - run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - run: ls -lh android/app/build/outputs/bundle/release/
      - uses: actions/upload-artifact@v5
        with:
          name: AJBN-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab
