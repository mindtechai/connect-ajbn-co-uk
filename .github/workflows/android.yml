name: Build Android AAB uk.co.ajbn.connect
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Verify dist exists (FAIL if blank)
        run: |
          echo "=== Root ==="
          ls -la
          echo ""
          echo "=== Checking dist ==="
          if [ ! -d "dist" ]; then
            echo "::error::dist folder missing! Check vite.config.ts base='./' and build script"
            ls -la
            exit 1
          fi
          ls -lh dist/
          echo ""
          echo "=== dist/index.html head ==="
          head -30 dist/index.html
          echo ""
          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html NOT FOUND - build failed"
            exit 1
          fi
          SIZE=$(du -sh dist/ | cut -f1)
          echo "dist size: $SIZE"
          if [ $(du -sk dist/ | cut -f1) -lt 100 ]; then
            echo "::error::dist too small (<100KB) - likely empty, will cause white screen on S25"
            exit 1
          fi

      - name: Add android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi

      - name: Copy web assets to Android
        run: |
          npx @capacitor/cli copy android
          npx @capacitor/cli sync android
          echo "=== Android assets ==="
          ls -lh android/app/src/main/assets/public/ | head -20
          ls -lh android/app/src/main/assets/public/assets/ | head -20 || true

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secrets"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/keystore.properties
          elif [ -f android/app/upload-keystore.jks ] && [ -f android/keystore.properties ]; then
            echo "Using keystore committed in the repository"
          else
            echo "::warning::No signing keystore available - the bundle will be UNSIGNED"
          fi

      - name: Build release bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: List outputs and check size
        run: |
          ls -lh android/app/build/outputs/bundle/release/
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          SIZE=$(du -h "$AAB" | cut -f1)
          echo "AAB size: $SIZE - $AAB"
          BYTES=$(stat -c%s "$AAB")
          if [ $BYTES -lt 5000000 ]; then
            echo "::warning::AAB is only $SIZE (<5MB) - likely still blank! Should be 6-8MB+"
          else
            echo "✅ AAB size looks good for S25"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: AJBN-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
