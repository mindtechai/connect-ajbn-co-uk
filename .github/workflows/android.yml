name: Build Android AAB uk.co.ajbn.connect
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bun run build

      - name: Prepare dist for Capacitor
        run: |
          set -e
          if [ ! -d dist ]; then
            for candidate in .output/public dist/client build/client build out; do
              if [ -d "$candidate" ]; then
                echo "Copying $candidate -> dist"
                mkdir -p dist
                cp -r "$candidate"/. dist/
                break
              fi
            done
          fi
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo "No index.html in build output - writing redirect shell"
            cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>AJBN Connect</title>
              <script>window.location.replace('https://connect.ajbn.co.uk');</script>
            </head>
            <body></body>
          </html>
          HTML
          fi
          ls -la
          ls -la dist || true

      - name: Ensure Android project
        run: |
          set -e
          mkdir -p android/app/src/main/assets
          if [ ! -f android/settings.gradle ]; then
            echo "Android project missing - adding it"
            npx @capacitor/cli add android
          fi

      - run: npx @capacitor/cli sync android

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secrets"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/keystore.properties
          elif [ -f android/app/upload-keystore.jks ] && [ -f android/keystore.properties ]; then
            echo "Using keystore committed in the repository"
          else
            echo "::warning::No signing keystore available - the bundle will be UNSIGNED and cannot be uploaded to Play Console"
          fi

      - name: Build release bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: List outputs
        run: ls -lh android/app/build/outputs/bundle/release/

      - uses: actions/upload-artifact@v5
        with:
          name: AJBN-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
