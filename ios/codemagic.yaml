workflows:
  ios-release:
    name: AJBN Connect iOS - uk.co.ajbn.connect
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set Build 9 - Apple Sign In Guideline 4.8 fix
        script: |
          echo "=== BUMPING TO BUILD 9 ==="
          PROJ=$(find . -name "*.xcodeproj" -type d | head -1)
          DIR=$(dirname "$PROJ")
          cd "$DIR"
          agvtool new-version -all 9
          agvtool new-marketing-version 1.0.3
          agvtool what-version -terse
          cd -
      - name: Build IPA for iOS (unsigned - pending team)
        script: |
          echo "Building uk.co.ajbn.connect v1.0.3 Build 9 - Apple Sign In fixed"
          xcodebuild -project AJBNConnect.xcodeproj -scheme AJBNConnect -configuration Release -destination generic/platform=iOS -sdk iphoneos archive -archivePath build/AJBNConnect.xcarchive CODE_SIGNING_ALLOWED=NO PRODUCT_BUNDLE_IDENTIFIER=uk.co.ajbn.connect SKIP_INSTALL=NO
          ls -lh build/
    artifacts:
      - build/*.xcarchive
      - build/*.ipa
